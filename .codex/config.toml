# Project-scoped Codex settings. Only subagents get an explicit model.
# The primary agent keeps the model selected by the user.
[agents]
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"

# Model availability varies by account and Codex release. If gpt-6-luna is
# unavailable, change only the subagent model or remove the defaults.
