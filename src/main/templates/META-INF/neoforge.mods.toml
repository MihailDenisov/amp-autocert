modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description="Server-side Let's Encrypt TLS certificate issuance and renewal for AutoModpack using Cloudflare DNS-01."
authors="amp-autocert contributors"
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="SERVER"

[[dependencies.${mod_id}]]
modId="automodpack_mod"
type="required"
versionRange="${automodpack_version_range}"
ordering="AFTER"
side="SERVER"
